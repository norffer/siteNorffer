<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <title>site simples</title>
    <style>

body {
    background-color: rgb(36, 36, 36);
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    text-align: center;}

h1{
    display: inline-block;
    color: aliceblue;
    padding: 10px 10px;
    background-color: rgb(26, 26, 26);}

a{
    display: inline-block;

} 

a:hover {
    background-color: rgb(50, 50, 50);

}

p{

    font-size: large;
    background-color: rgb(26, 26, 26);
    color: aliceblue;
    border-radius: 10px;
}

div{

}

img{
    padding: 30px 30px;

}

button{
   display: inline-block;
    margin: 10px;
    text-decoration: none;
    color: aliceblue;
    padding: 10px 20px;
    background-color: rgb(26, 26, 26);
    border-radius: 10px;
    border: none;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
}

button:hover{
    background-color: rgb(50, 50, 50);
    transform: scale(1.3);
    transition: 0.3s ease;
}


textarea{

    height: 100px;

    background-color: rgb(26, 26, 26);
    color: aliceblue;

    border: none;
}
